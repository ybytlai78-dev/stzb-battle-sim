<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>战斗模拟器 · 三列配将台</title>
  <!--
    Huashu · assumptions:
    本页是套2生产向配将台，不是战场沙盘。form 来自「两边槽、中间挑人」的日常操作：
    池子永远居中，开战则离开工作台进入独立战报页。画布默认横屏手机 844×390，
    桌面只加宽同一三列骨架。演示数据冻结（红胜 / 6 回合 / 种子 384291），不接引擎、
    不用 Math.random 决胜负。画像走 ../public/portraits/{id}.jpg；缺图灰底+姓名。
    战法名取自仓库 heroes.json / skills.ts；司马懿主战法库中无 id，沿用数据里的「破凰」。
    等级/红度/加点为展示控件，不做真实面板计算。竖屏不画主稿。
    Huashu · form-from-content: 配将台 = 左红槽 | 中武将池 | 右蓝槽。
    Huashu · pre-emit: P4 H4 E4 S5 R4 V5
    Huashu · slop-test: 26/26 ✓ — N/A: H1 H5 H6 H7
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg: #12100f;
      --color-surface: #1c1817;
      --color-surface-2: #241f1d;
      --color-line: #3a3330;
      --color-text: #eeeae4;
      --color-text-muted: #8a827c;
      --color-crimson: #8f2c2c;
      --color-gold: #c49a36;
      --color-green: #3a6b4a;
      --color-blue: #2a4a7c;
      --font-display: "Noto Serif SC", "Source Han Serif SC", serif;
      --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --radius: 8px;
      --card-accent: 2px solid var(--color-crimson);
      --color-overlay: color-mix(in srgb, var(--color-bg) 78%, transparent);
      --color-wounded: color-mix(in srgb, var(--color-gold) 38%, var(--color-surface-2));
      --color-dead: color-mix(in srgb, var(--color-text-muted) 28%, var(--color-bg));
      --color-live: color-mix(in srgb, var(--color-crimson) 82%, var(--color-gold) 18%);
      --color-phy: color-mix(in srgb, var(--color-gold) 78%, var(--color-crimson) 22%);
      --color-stg: color-mix(in srgb, var(--color-blue) 58%, var(--color-text) 42%);
      --color-focus: var(--color-gold);
      --color-grade-s: #d989a0;
      --color-grade-a: #4a7ab0;
      --color-grade-b: #4e8a62;
      --color-scroll: color-mix(in srgb, var(--color-text-muted) 28%, var(--color-bg));
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      background: var(--color-surface);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 13px;
      line-height: 1.6;
    }

    button, input {
      font-family: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      border: 0;
      background: none;
      padding: 0;
    }
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    h1, h2, h3, .brand, .seal, .panel-title {
      font-family: var(--font-display);
      font-style: normal;
      font-weight: 700;
      letter-spacing: 0.04em;
      overflow-wrap: anywhere;
      min-width: 0;
      text-wrap: pretty;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 56px 20px 36px;
    }

    .vp-bar {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 40;
      display: flex;
      gap: 6px;
      padding: 4px;
      background: var(--color-surface-2);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
    }
    .vp-bar button {
      padding: 6px 12px;
      font-size: 12px;
      color: var(--color-text-muted);
      border-radius: 6px;
    }
    .vp-bar button.is-on {
      background: var(--color-crimson);
      color: var(--color-text);
    }

    .stage {
      display: grid;
      place-items: center;
    }

    .canvas {
      position: relative;
      background: var(--color-bg);
      border: 1px solid var(--color-line);
      overflow: hidden;
      transform-origin: top left;
    }
    .canvas.vp-phone { width: 844px; height: 390px; }
    .canvas.vp-desktop { width: 1440px; height: 900px; }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .screen[hidden] { display: none !important; }

    .topbar, .botbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      border-color: var(--color-line);
      border-style: solid;
    }
    .topbar {
      justify-content: space-between;
      border-bottom-width: 1px;
      padding: 0 var(--space-3);
    }
    .botbar {
      justify-content: space-between;
      border-top-width: 1px;
      padding: 0 var(--space-3);
    }
    .vp-phone .topbar { height: 34px; }
    .vp-phone .botbar { height: 42px; }
    .vp-desktop .topbar { height: 52px; }
    .vp-desktop .botbar { height: 64px; }

    /** 战报页无顶栏：页签挪到底栏，把高度还给六行武将。 */
    #report .report-dock {
      gap: 6px;
    }
    #report .report-dock .tabs {
      flex: 1;
      justify-content: center;
      min-width: 0;
    }
    #report .report-dock .tab-btn {
      padding: 6px 8px;
    }
    #report .report-dock .ghost {
      padding: 0 8px;
    }
    #report .report-dock .cta {
      min-width: 96px;
      height: 28px;
      font-size: 13px;
      padding: 0 10px;
    }
    .vp-desktop #report .report-dock .cta {
      min-width: 140px;
      height: 42px;
      font-size: 16px;
    }

    .brand {
      font-size: 15px;
      margin: 0;
    }
    .vp-desktop .brand { font-size: 22px; }

    .nav-text {
      display: flex;
      gap: 2px;
    }
    .nav-text button,
    .tab-btn {
      padding: 6px 10px;
      color: var(--color-text-muted);
      font-size: 12px;
    }
    .nav-text button.is-on,
    .tab-btn.is-on {
      color: var(--color-gold);
    }
    .vp-desktop .nav-text button,
    .vp-desktop .tab-btn { font-size: 14px; padding: 8px 14px; }

    .tabs { display: flex; gap: 2px; }

    .bench {
      flex: 1;
      min-height: 0;
      display: grid;
      min-width: 0;
    }
    .vp-phone .bench {
      grid-template-columns: 168px minmax(0, 1fr) 168px;
      gap: 8px;
      padding: 8px;
    }
    .vp-desktop .bench {
      grid-template-columns: 300px minmax(0, 1fr) 300px;
      gap: 18px;
      padding: 18px 22px;
    }

    .rack, .well {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .well {
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
      border-bottom: var(--card-accent);
      padding: 8px;
    }
    .vp-desktop .well { padding: 14px; gap: 10px; }

    .rack-head, .well-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex: 0 0 auto;
    }
    .rack-title {
      font-family: var(--font-display);
      font-style: normal;
      font-size: 12px;
      color: var(--color-gold);
    }
    .vp-desktop .rack-title { font-size: 16px; }
    .rack.red .rack-title { color: var(--color-crimson); }
    .rack.blue .rack-title { color: color-mix(in srgb, var(--color-text) 70%, var(--color-blue)); }

    .chip {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 8px;
      border: 1px solid var(--color-line);
      border-radius: 999px;
      font-size: 10px;
      color: var(--color-gold);
      background: var(--color-surface-2);
    }
    .vp-desktop .chip { height: 26px; font-size: 12px; padding: 0 10px; }
    .chip:hover { border-color: var(--color-gold); }

    .slots {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .vp-desktop .slots { gap: 12px; }

    .slot {
      min-width: 0;
      min-height: 0;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
      border-bottom: var(--card-accent);
      padding: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: border-color 160ms ease, background-color 160ms ease;
    }
    .vp-desktop .slot { padding: 12px; gap: 12px; }
    .slot.is-empty { justify-content: center; color: var(--color-text-muted); }
    .slot.is-pick {
      border-color: var(--color-gold);
      background: var(--color-surface-2);
    }
    .slot.drag-over {
      border-color: var(--color-gold);
      background: color-mix(in srgb, var(--color-gold) 12%, var(--color-surface));
    }
    .slot.is-empty .hint { font-size: 11px; letter-spacing: 0.08em; }
    .vp-desktop .slot.is-empty .hint { font-size: 14px; }

    .face {
      position: relative;
      flex: 0 0 auto;
      background: var(--color-surface-2);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .face::after {
      content: attr(data-name);
      font-size: 10px;
      color: var(--color-text-muted);
      text-align: center;
      padding: 4px;
      z-index: 0;
    }
    .face img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .vp-phone .slot .face { width: 52px; height: 52px; border-radius: 4px; }
    .vp-desktop .slot .face { width: 92px; height: 92px; border-radius: 6px; }

    .slot-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .slot-name {
      font-family: var(--font-display);
      font-style: normal;
      font-size: 13px;
      line-height: 1.2;
    }
    .vp-desktop .slot-name { font-size: 18px; }
    .slot-pos { font-size: 10px; color: var(--color-text-muted); }
    .vp-desktop .slot-pos { font-size: 12px; }
    .skill-dots { display: flex; gap: 4px; margin-top: 2px; }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--color-grade-s);
    }
    .dot.s { background: var(--color-grade-s); }
    .dot.a { background: var(--color-grade-a); }
    .dot.b { background: var(--color-grade-b); }
    .vp-desktop .skill-names {
      font-size: 11px;
      color: var(--color-text-muted);
      line-height: 1.45;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .vp-phone .skill-names { display: none; }
    .vp-desktop .skill-dots { display: none; }

    .well-title {
      font-family: var(--font-display);
      font-style: normal;
      font-size: 13px;
    }
    .vp-desktop .well-title { font-size: 18px; }

    .filters { display: flex; flex-direction: column; gap: 6px; }
    .search {
      width: 100%;
      height: 28px;
      padding: 0 10px;
      background: var(--color-bg);
      border: 1px solid var(--color-line);
      border-radius: 6px;
      font-size: 12px;
    }
    .vp-desktop .search { height: 36px; font-size: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      height: 22px;
      padding: 0 8px;
      border: 1px solid var(--color-line);
      border-radius: 999px;
      font-size: 11px;
      color: var(--color-text-muted);
      background: var(--color-bg);
    }
    .tag.is-on {
      border-color: var(--color-gold);
      color: var(--color-gold);
    }

    .pool {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: grid;
      gap: 6px;
      align-content: start;
    }
    .vp-phone .pool { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .vp-desktop .pool { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }

    .pcard {
      min-width: 0;
      background: var(--color-surface-2);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
      border-bottom: var(--card-accent);
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: border-color 160ms ease, opacity 160ms ease;
    }
    .pcard .face { width: 100%; aspect-ratio: 3 / 4; border-radius: 4px; }
    .pcard .nm {
      font-size: 11px;
      font-family: var(--font-display);
      font-style: normal;
      line-height: 1.2;
    }
    .pcard .meta { font-size: 10px; color: var(--color-text-muted); }
    .pcard.is-used { opacity: 0.38; }
    .pcard.is-locked { opacity: 0.38; cursor: not-allowed; }
    .pcard:hover:not(.is-locked) { border-color: var(--color-gold); }

    .empty-pool {
      grid-column: 1 / -1;
      color: var(--color-text-muted);
      text-align: center;
      padding: 28px 8px;
      font-size: 13px;
    }

    .morale {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .morale.red { color: var(--color-crimson); }
    .morale.blue { color: color-mix(in srgb, var(--color-text) 55%, var(--color-blue)); }
    .step {
      width: 24px;
      height: 24px;
      border: 1px solid var(--color-line);
      border-radius: 4px;
      background: var(--color-surface-2);
      color: var(--color-text);
    }
    .morale b {
      font-weight: 700;
      color: var(--color-text);
      min-width: 2.2em;
      text-align: center;
      display: inline-block;
    }

    .cta {
      min-width: 120px;
      height: 32px;
      padding: 0 18px;
      background: var(--color-crimson);
      color: var(--color-text);
      border-radius: 6px;
      font-family: var(--font-display);
      font-style: normal;
      font-size: 14px;
      letter-spacing: 0.12em;
    }
    .vp-desktop .cta { height: 42px; min-width: 160px; font-size: 16px; }
    .ghost {
      height: 28px;
      padding: 0 12px;
      border: 1px solid var(--color-line);
      border-radius: 6px;
      background: var(--color-surface);
      font-size: 12px;
      color: var(--color-text);
    }
    .ghost.is-on { border-color: var(--color-gold); color: var(--color-gold); }

    .toast {
      position: absolute;
      left: 50%;
      top: 44px;
      transform: translateX(-50%);
      z-index: 30;
      background: var(--color-surface-2);
      border: 1px solid var(--color-crimson);
      color: var(--color-text);
      padding: 8px 14px;
      border-radius: var(--radius);
      font-size: 12px;
      max-width: 86%;
      text-align: center;
    }
    .toast[hidden] { display: none; }

    .scrim {
      position: absolute;
      inset: 0;
      background: var(--color-overlay);
      z-index: 20;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 18px;
    }
    .scrim[hidden] { display: none !important; }
    .panel {
      width: min(720px, 100%);
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
      border-bottom: var(--card-accent);
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--color-line);
    }
    .panel-title { font-size: 16px; margin: 0; }
    .x {
      width: 28px;
      height: 28px;
      font-size: 18px;
      color: var(--color-text-muted);
    }
    .panel-body {
      padding: 12px 14px;
      overflow: auto;
      flex: 1;
      min-height: 0;
    }

    .detail {
      display: grid;
      gap: 14px;
      min-height: 0;
      flex: 1;
    }
    .vp-phone .detail { grid-template-columns: 140px minmax(0, 1fr); }
    .vp-desktop .detail { grid-template-columns: 280px minmax(0, 1fr); gap: 24px; padding: 8px; }
    .detail-face { width: 100%; aspect-ratio: 3 / 4; border-radius: 6px; }
    .kv { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 12px; }
    .kv label { color: var(--color-text-muted); }
    .range { width: 100%; accent-color: var(--color-crimson); }
    .pts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .pts span {
      background: var(--color-bg);
      border: 1px solid var(--color-line);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
    }
    .skill-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .skill-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--color-bg);
      border: 1px solid var(--color-line);
      border-radius: 6px;
      border-bottom: var(--card-accent);
      padding: 6px 8px;
      font-size: 12px;
    }

    .bonus-grid {
      display: grid;
      gap: 10px;
    }
    .vp-desktop .bonus-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .bm-card {
      background: var(--color-bg);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
      border-bottom: var(--card-accent);
      padding: 10px;
    }
    .bm-card h3 { margin: 0 0 6px; font-size: 13px; }
    .flag {
      display: inline-block;
      font-size: 10px;
      color: var(--color-gold);
      border: 1px solid var(--color-gold);
      padding: 1px 6px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .muted { color: var(--color-text-muted); }

    .history-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
      border-bottom: var(--card-accent);
      background: var(--color-bg);
    }

    .report {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .report-body {
      flex: 1;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
    }
    .vp-desktop .report-body { padding: 16px 22px; }
    .pane { flex: 1; min-height: 0; min-width: 0; display: none; flex-direction: column; }
    .pane.is-on { display: flex; }

    .demo-tag {
      align-self: flex-start;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--color-gold);
      border: 1px solid var(--color-gold);
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .brief-meta {
      font-size: 12px;
      color: var(--color-text-muted);
      margin-bottom: 8px;
    }

    .mirror {
      flex: 1;
      min-height: 0;
      display: grid;
      align-items: stretch;
      gap: 6px;
    }
    .vp-phone .mirror { grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr); }
    .vp-desktop .mirror { grid-template-columns: minmax(0, 1fr) 120px minmax(0, 1fr); gap: 16px; }
    .side {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      min-width: 0;
    }
    .vp-desktop .side { gap: 12px; }
    .rcard {
      min-width: 0;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
      border-bottom: var(--card-accent);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .rcard.is-dead { filter: saturate(0.35); }
    .rcard .face { width: 100%; aspect-ratio: 3 / 4; border-radius: 4px; }
    .rcard .nm { font-family: var(--font-display); font-style: normal; font-size: 12px; }
    .bar {
      display: flex;
      height: 8px;
      overflow: hidden;
      border-radius: 2px;
      background: var(--color-dead);
    }
    .bar i { display: block; height: 100%; }
    .bar .live { background: var(--color-live); }
    .bar .wnd { background: var(--color-wounded); }
    .bar .ded { background: var(--color-dead); }
    .nums { font-size: 10px; color: var(--color-text-muted); line-height: 1.3; }

    .axis {
      display: grid;
      place-items: center;
      min-width: 0;
    }
    .seal {
      width: 52px;
      height: 52px;
      border: 2px solid var(--color-gold);

       * @param {string} s
       */
      function paintNames(s) {
        return s
          .replace(/【([^】]+)】/g, (_, n) => {
            const g = SKILL_GRADE[n];
            if (g) return `<span class="sk-${g}">【${n}】</span>`;
            const found = Object.values(HEROES).find((h) => h.name === n);
            const side = found && RED_IDS.includes(found.id) ? 'red' : 'blue';
            return `<span class="nm-${side}">【${n}】</span>`;
          })
          .replace(/「([^」]+)」/g, (m, n) => {
            const g = SKILL_GRADE[n];
            if (g) return `<span class="sk-${g}">「${n}」</span>`;
            const found = Object.values(HEROES).find((h) => h.name === n);
            if (!found) return m;
            const side = RED_IDS.includes(found.id) ? 'red' : 'blue';
            return `<span class="nm-${side}">「${n}」</span>`;
          });
      }

        state.playing = false;

      function togglePlay() {
        if (state.playing) {
          stopPlay();
          renderDetailPane();
          return;
        }
        if (state.round >= 3) state.round = 0;
        state.playing = true;
        renderDetailPane();
        state.playTimer = window.setInterval(() => {
          if (state.round >= 3) {
            stopPlay();
            renderDetailPane();
            return;
          }
          state.round += 1;
          renderDetailPane();
        }, 900);
      }

      function occupiedSide(id) {
        if (state.red.includes(id)) return 'red';
        if (state.blue.includes(id)) return 'blue';
        return null;

       * 上阵。对队同 id 拒绝。
       * @param {'red'|'blue'} side
       * @param {number} index
       * @param {string} id
       */
      function assign(side, index, id) {
        const other = side === 'red' ? 'blue' : 'red';
        if (state[other].includes(id)) {
          toast('双方不能使用同一武将');
          return;
        }
        state[side] = state[side].map((cur, i) => (cur === id ? null : cur));
        state[side][index] = id;
        state.pick = null;
        renderWorkbench();
      }

      /** @param {'red'|'blue'} side */
      function bonusLabel(side) {
        const ids = state[side].filter(Boolean);
        if (side === 'red' && ids.length === 3 && ids.every((id) => HEROES[id].faction === '蜀')) return '三蜀';
        if (side === 'blue' && ids.length === 3 && ids.every((id) => HEROES[id].faction === '魏' && HEROES[id].troop === '骑')) return '三魏骑';
        if (!ids.length) return '未激活';
        const fac = ids.map((id) => HEROES[id].faction);
        const major = fac.sort((a, b) => fac.filter((x) => x === b).length - fac.filter((x) => x === a).length)[0];
        return `阵营·${major}`;
      }

        const label = side === 'red' ? '红队' : '蓝队';
        const rows = state[side].map((id, index) => {
          const pos = POS[index];
          if (!id) {
            const pick = state.pick && state.pick.side === side && state.pick.index === index;
            return `<button type="button" class="slot is-empty${pick ? ' is-pick' : ''}" data-slot="${side}-${index}">
              <span class="hint">点此上阵</span>
            </button>`;
          }
          const h = HEROES[id];
          const skills = [h.main, ...h.extra];
          return `<button type="button" class="slot" data-slot="${side}-${index}">

            <div class="slot-body">
              <div class="slot-name">${h.name}</div>
              <div class="slot-pos">${pos} · ${h.faction}${h.troop}</div>

          <button type="button" class="chip" data-bonus="${side}">${bonusLabel(side)}</button>

          if (state.troop && h.troop !== state.troop) return false;
          return true;
        });

            <span class="nm">${h.name}</span>
            <span class="meta">${h.faction}${h.troop}</span>
          </div>`;
        }).join('');

      }

      /**
       * @param {number[]} t 次数 / 杀伤 / 恢复
       * @param {string} name
       * @param {string} [grade]
       */
      function skillCell(t, name, grade) {
        const badge = grade
          ? `<i class="grade ${grade}">${grade.toUpperCase()}</i>`
          : '';
        const heal = t[2] > 0
          ? ` <span class="heal">恢复 ${t[2].toLocaleString()}</span>`
          : '';
        return `<div class="sk">
          <div class="sk-h">${badge}<span class="sk-n">${name}</span><span class="sk-c">${t[0]}次</span></div>
          <div class="sk-d">杀伤 ${t[1].toLocaleString()}${heal}</div>
        </div>`;
      }

      /**
       * 统计一行：站位竖签 + 头像卡 + 四列战法或占比条。
       * @param {string} id
       * @param {number} index
       * @param {'red'|'blue'} side
       */
      function statsRow(id, index, side) {
        const h = HEROES[id];
        const s = STATS.find((x) => x.id === id);
        const pos = POS[index];
        const body = state.statsMode === 'skill'
          ? `<div class="sk-row">
              ${skillCell(s.atk, '普通攻击')}
              ${skillCell(s.main, h.main, h.grade[0])}
              ${skillCell(s.e1, h.extra[0], h.grade[1])}
              ${skillCell(s.e2, h.extra[1], h.grade[2])}
            </div>`
          : (() => {
              const sh = SHARE[id];
              return `<div class="sh-row">
                <div class="meter"><span>伤害 ${sh.dmg}%</span><span class="bar"><i style="width:${sh.dmg}%"></i></span></div>
                <div class="meter heal"><span>恢复 ${sh.heal}%</span><span class="bar"><i style="width:${sh.heal}%"></i></span></div>
                <div class="meter ctrl"><span>控制 ${sh.ctrl}%</span><span class="bar"><i style="width:${sh.ctrl}%"></i></span></div>
              </div>`;
            })();
        return `<div class="st-row">
          <span class="pos-tag ${side}">${pos}</span>
          ${heroMini(id)}
          ${body}
        </div>`;
      }

      /** 战报统计：红大营→中军→前锋，再接蓝前锋→中军→大营（对阵相向）。 */
      function renderStats() {
        const red = RED_IDS.map((id, i) => statsRow(id, i, 'red')).join('');
        const blue = [2, 1, 0].map((i) => statsRow(BLUE_IDS[i], i, 'blue')).join('');
        $('pane-stats').innerHTML = `
          <div class="st-page">
            <aside class="st-rail">
              <button type="button" data-stats="hero"${state.statsMode === 'hero' ? ' class="is-on"' : ''}>武将统计</button>
              <button type="button" data-stats="skill"${state.statsMode === 'skill' ? ' class="is-on"' : ''}>战法统计</button>
            </aside>
            <div class="st-main">
              <div class="st-win">胜</div>
              <div class="st-team">${red}</div>
              <div class="st-team">${blue}</div>
            </div>
          </div>`;
      }

      /**
       * 渲染一条日志。
       * @param {{kind:string, text?:string, ok?:boolean, net?:number, sources?:string[]}} line
       */
      function renderLine(line) {
        if (line.kind === 'trig') {
          const cls = line.ok ? 'ok' : 'fail';
          return `<div class="ev ${cls}">${paintNames(line.text)}</div>`;
        }
        if (line.kind === 'mod') {
          const verb = line.net > 0 ? '提升' : '降低';
          const src = (line.sources || []).map((s) => `<div class="dmg-pop-item">${paintNames(s)}</div>`).join('');
          return `<div class="ev mod">此次伤害共计${verb} <a class="dmg-link" href="javascript:void(0)">${Math.abs(line.net)}%</a>
            <div class="dmg-popup" hidden>
              <div class="dmg-pop-title">增减伤统计</div>
              ${src}
            </div>
          </div>`;
        }
        const map = { phy: 'phy', stg: 'stg', heal: 'heal', cast: 'cast', status: 'status', tgt: 'dim', dim: 'dim', ok: 'ok' };
        return `<div class="ev ${map[line.kind] || 'dim'}">${paintNames(line.text || '')}</div>`;
      }

      /**
       * 把中栏滚到指定行动组（不用 scrollIntoView，避免外壳缩放错位）。
       * @param {string} id
       */
      function scrollToAct(id) {
        const box = document.querySelector('.dv-log');
        const g = document.getElementById(`act-${id}`);
        if (!box || !g) return;
        box.scrollTop = g.offsetTop - box.offsetTop;
      }

      /** 战报详情：左出手顺序、中行动分组、右详简与回合/自动播放。 */
      function renderDetailPane() {
        const pack = DETAIL_LOGS[state.round] ?? DETAIL_LOGS[0];
        const troops = ROUND_TROOPS[state.round] ?? ROUND_TROOPS[0];
        if (!state.actId || !pack.order.includes(state.actId)) state.actId = pack.order[0];
        const turns = pack.order.map((id, i) => `
          <button type="button" class="turn${state.actId === id ? ' is-on' : ''}" data-jump="${id}">
            <span class="n">${i + 1}</span>${avatarEl(id)}
          </button>`).join('');
        const groups = pack.groups.map((g) => {
          const side = RED_IDS.includes(g.id) ? 'red' : 'blue';
          const h = HEROES[g.id];
          const t = troops[g.id] ? troops[g.id][0] : 9000;
          const body = g.lines.map(renderLine).join('');
          return `<div class="act-group" id="act-${g.id}">
            <div class="act-head ${side}">
              ${avatarEl(g.id)}
              <span>${paintNames('【' + h.name + '】')}</span>
              <span class="phase">行动阶段 · ${g.phase}</span>
              <span class="troops">兵力 ${t.toLocaleString()}</span>
            </div>
            <div class="act-body">${body}</div>
          </div>`;
        }).join('');
        let mid = '';
        if (pack.isPrep) {
          mid += pack.sections.map((sec) =>
            `<div class="es-phase">【${sec.label}】</div>${sec.lines.map(renderLine).join('')}`
          ).join('');
          mid += `<div class="es-phase">【战法】</div>`;
        }
        mid += groups;
        const rbtns = [0, 1, 2, 3].map((n) => {
          const label = n === 0 ? '始' : String(n);
          return `<button type="button" data-set-round="${n}"${state.round === n ? ' class="is-on"' : ''}>${label}</button>`;
        }).join('');
        $('pane-detail').innerHTML = `
          <div class="dv${state.simple ? ' is-simple' : ''}">
            <aside class="dv-turns">${turns}</aside>
            <section class="dv-mid">
              <div class="dv-head">
                <strong>${pack.title}</strong>
                <button type="button" class="ghost${pack.isPrep ? ' is-on' : ''}" data-set-round="0">回合前阶段</button>
                <span class="muted">演示摘录 · 共 6 回合</span>
              </div>
              <div class="dv-log">${mid}</div>
            </section>
            <aside class="dv-rail">
              <button type="button" data-simple="0"${state.simple ? '' : ' class="is-on"'}>详</button>
              <button type="button" data-simple="1"${state.simple ? ' class="is-on"' : ''}>简</button>
              <span class="sep"></span>
              <button type="button" data-round="-1"${state.round === 0 ? ' disabled' : ''}>上</button>
              ${rbtns}
              <button type="button" data-round="1"${state.round === 3 ? ' disabled' : ''}>下</button>
              <span class="sep"></span>
              <button type="button" data-play="${state.playing ? '1' : '0'}"${state.playing ? ' class="is-on"' : ''}>${state.playing ? '停' : '播'}</button>
            </aside>
          </div>`;
        const go = () => scrollToAct(state.actId);
        if (typeof requestAnimationFrame === 'function') requestAnimationFrame(go);
        else go();
      }

      function renderReport() {
        renderBrief();
        renderStats();
        renderDetailPane();
        document.querySelectorAll('.tab-btn').forEach((b) => {
          b.classList.toggle('is-on', b.getAttribute('data-tab') === state.tab);
        });
        document.querySelectorAll('.pane').forEach((p) => {
          p.classList.toggle('is-on', p.id === `pane-${state.tab}`);
        });
      }

      function closeOverlay() {
        state.overlay = null;
        state.detail = null;
        $('scrim').hidden = true;
      }

      function openOverlay(kind) {
        state.overlay = kind;
        const panel = $('panel');
        if (kind === 'history') {
          panel.innerHTML = `<div class="panel-head"><h2 class="panel-title">战报</h2><button type="button" class="x" data-close>×</button></div>
            <div class="panel-body">${state.hasReport
              ? `<button type="button" class="history-row" data-act="open-report"><span>红胜 · 6 回合</span><span class="muted">种子 384291</span></button>`
              : `<p class="muted">暂无战报</p>`}</div>`;
        } else if (kind === 'skills') {
          const ids = [...state.red, ...state.blue].filter(Boolean);
          const rows = ids.length
            ? ids.map((id) => {
                const h = HEROES[id];
                return `<div class="skill-row"><i class="dot ${h.grade[0]}"></i><span>${h.name} · ${h.main}</span></div>
                  <div class="skill-row"><i class="dot ${h.grade[1]}"></i><span>${h.extra[0]}</span></div>
                  <div class="skill-row"><i class="dot ${h.grade[2]}"></i><span>${h.extra[1]}</span></div>`;
              }).join('')
            : '<p class="muted">上阵后再查看携带战法。</p>';
          panel.innerHTML = `<div class="panel-head"><h2 class="panel-title">战法</h2><button type="button" class="x" data-close>×</button></div>
            <div class="panel-body"><p class="muted">本页只列当前队伍战法，不是全库图鉴。</p>${rows}</div>`;
        } else if (kind === 'bonus') {
          const side = state.overlaySide;
          const title = side === 'red' ? '红队部队加成' : '蓝队部队加成';
          const fac = side === 'red' ? '蜀' : '魏';
          const troop = side === 'red' ? '步兵系' : '骑兵系';
          const on = bonusLabel(side) !== '未激活';
          panel.innerHTML = `<div class="panel-head"><h2 class="panel-title">${title}</h2><button type="button" class="x" data-close>×</button></div>
            <div class="panel-body"><div class="bonus-grid">
              <article class="bm-card"><h3>阵营加成-${fac}</h3><span class="flag">${on ? '战斗中生效' : '未激活'}</span><p class="${on ? '' : 'muted'}">${on ? '攻击 / 谋略 / 防御 / 速度 +N（静态示意）' : '上阵同阵营武将可激活'}</p></article>
              <article class="bm-card"><h3>称号加成</h3><span class="flag">全局生效</span><p class="muted">配置指定武将组合可激活 前往查看</p></article>
              <article class="bm-card"><h3>兵种加成-${troop}</h3><span class="flag">${on ? '战斗中生效' : '未激活'}</span><p class="${on ? '' : 'muted'}">${on ? '同兵种上阵示意' : '未激活'}</p></article>
            </div></div>`;
        } else if (kind === 'hero') {
          const { side, index } = state.detail;
          const id = state[side][index];
          const h = HEROES[id];
          const atk = h.troop === '骑' || h.main.includes('冲') || h.main.includes('骑') || ['赵云', '张辽', '吕布', '关羽', '文鸯'].includes(h.name) ? 40 : 0;
          const stg = atk ? 0 : 40;
          panel.innerHTML = `<div class="panel-head"><h2 class="panel-title">${h.name}</h2><button type="button" class="x" data-close>×</button></div>
            <div class="panel-body">
              <div class="detail">
                ${face(id, 'detail-face')}
                <div>
                  <div class="kv">
                    <label>站位</label><span>${POS[index]} · ${h.faction}${h.troop}</span>
                    <label>等级</label><span>40（展示）<input class="range" type="range" min="40" max="50" value="40" /></span>
                    <label>红度</label><span>0<input class="range" type="range" min="0" max="5" value="0" /></span>
                  </div>
                  <div class="pts">
                    <span>攻击 ${atk}</span><span>防御 0</span>
                    <span>谋略 ${stg}</span><span>速度 0</span>
                  </div>
                  <div class="skill-list">
                    <div class="skill-row"><i class="dot ${h.grade[0]}"></i>${h.main}</div>
                    <div class="skill-row"><i class="dot ${h.grade[1]}"></i>${h.extra[0]}</div>
                    <div class="skill-row"><i class="dot ${h.grade[2]}"></i>${h.extra[1]}</div>
                  </div>
                  <p style="margin-top:12px"><button type="button" class="ghost" data-unequip>卸下</button></p>
                </div>
              </div>
            </div>`;
        }
        $('scrim').hidden = false;
      }

      function showWorkbench() {
        stopPlay();
        state.screen = 'workbench';
        $('workbench').hidden = false;
        $('report').hidden = true;
        closeOverlay();
        renderWorkbench();
      }

      function showReport() {
        stopPlay();
        state.screen = 'report';
        state.tab = 'brief';
        state.round = 0;
        state.actId = null;
        state.simple = false;
        state.statsMode = 'skill';
        $('workbench').hidden = true;
        $('report').hidden = false;
        closeOverlay();
        renderReport();
      }

      function startBattle() {
        if (!teamHas('red') || !teamHas('blue')) {
          toast('红蓝两队都至少需要 1 名武将');
          return;
        }
        state.snapshot = { red: state.red.slice(), blue: state.blue.slice() };
        state.hasReport = true;
        state.round = 1;
        showReport();
      }

      function fit() {
        const canvas = $('canvas');
        const stage = $('stage');
        const w = state.vp === 'phone' ? 844 : 1440;
        const h = state.vp === 'phone' ? 390 : 900;
        const maxW = Math.max(320, window.innerWidth - 32);
        const maxH = Math.max(200, window.innerHeight - 96);
        const s = Math.min(1, maxW / w, maxH / h);
        stage.style.width = `${w * s}px`;
        stage.style.height = `${h * s}px`;
        canvas.style.transform = `scale(${s})`;
      }

      document.querySelector('.vp-bar').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-vp]');
        if (!btn) return;
        state.vp = btn.getAttribute('data-vp');
        $('canvas').classList.toggle('vp-phone', state.vp === 'phone');
        $('canvas').classList.toggle('vp-desktop', state.vp === 'desktop');
        document.querySelectorAll('.vp-bar button').forEach((b) => b.classList.toggle('is-on', b === btn));
        fit();
        if (state.screen === 'workbench') renderWorkbench();
        else renderReport();
      });

      $('canvas').addEventListener('click', (e) => {
        const t = e.target;
        if (t.closest('[data-close]') || (t.id === 'scrim' && t === e.target)) {
          closeOverlay();
          return;
        }
        const vpIgnore = t.closest('.vp-bar');
        if (vpIgnore) return;

        const dmg = t.closest('.dmg-link');
        if (dmg) {
          e.preventDefault();
          const pop = dmg.parentElement.querySelector('.dmg-popup');
          document.querySelectorAll('.dmg-popup').forEach((el) => {
            if (el !== pop) el.hidden = true;
          });
          if (pop) pop.hidden = !pop.hidden;
          return;
        }

        const open = t.closest('[data-open]');
        if (open) {
          openOverlay(open.getAttribute('data-open'));
          return;
        }

        const bonus = t.closest('[data-bonus]');
        if (bonus) {
          state.overlaySide = bonus.getAttribute('data-bonus');
          openOverlay('bonus');
          return;
        }

        const slot = t.closest('[data-slot]');
        if (slot && state.screen === 'workbench') {
          const [side, idx] = slot.getAttribute('data-slot').split('-');
          const index = Number(idx);
          const id = state[side][index];
          if (!id) {
            state.pick = { side, index };
            renderWorkbench();
          } else {
            state.detail = { side, index };
            openOverlay('hero');
          }
          return;
        }

        const heroBtn = t.closest('[data-hero]');
        if (heroBtn && state.screen === 'workbench') {
          const id = heroBtn.getAttribute('data-hero');
          if (heroBtn.classList.contains('is-locked')) {
            toast('双方不能使用同一武将');
            return;
          }
          if (!state.pick) {
            toast('先点空槽，再选武将');
            return;
          }
          assign(state.pick.side, state.pick.index, id);
          return;
        }

        const filter = t.closest('[data-filter]');
        if (filter) {
          const [kind, val] = filter.getAttribute('data-filter').split(':');
          state[kind] = val || '';
          renderWorkbench();
          return;
        }

        const step = t.closest('.step');
        if (step) {
          const wrap = step.closest('.morale');
          const side = wrap.getAttribute('data-side');
          const next = Math.min(140, Math.max(80, state.morale[side] + Number(step.getAttribute('data-d'))));
          state.morale[side] = next;
          wrap.querySelector('b').textContent = String(next);
          return;
        }

        if (t.closest('#start')) {
          startBattle();
          return;
        }

        const tab = t.closest('[data-tab]');
        if (tab) {
          const next = tab.getAttribute('data-tab');
          if (next !== 'detail') stopPlay();
          state.tab = next;
          renderReport();
          return;
        }

        const statsMode = t.closest('[data-stats]');
        if (statsMode) {
          state.statsMode = statsMode.getAttribute('data-stats');
          renderStats();
          return;
        }

        const jump = t.closest('[data-jump]');
        if (jump) {
          state.actId = jump.getAttribute('data-jump');
          document.querySelectorAll('.turn').forEach((el) => {
            el.classList.toggle('is-on', el.getAttribute('data-jump') === state.actId);
          });
          scrollToAct(state.actId);
          return;
        }

        const setRound = t.closest('[data-set-round]');
        if (setRound) {
          state.round = Number(setRound.getAttribute('data-set-round'));
          renderDetailPane();
          return;
        }

        const simpleBtn = t.closest('[data-simple]');
        if (simpleBtn) {
          state.simple = simpleBtn.getAttribute('data-simple') === '1';
          renderDetailPane();
          return;
        }

        const playBtn = t.closest('[data-play]');
        if (playBtn) {
          togglePlay();
          return;
        }

        const act = t.closest('[data-act]');
        if (act) {
          const a = act.getAttribute('data-act');
          if (a === 'back') showWorkbench();
          if (a === 'again') showWorkbench();
          if (a === 'reuse') {
            if (state.snapshot) {
              state.red = state.snapshot.red.slice();
              state.blue = state.snapshot.blue.slice();
            }
            showWorkbench();
          }
          if (a === 'open-report' && state.hasReport) showReport();
          return;
        }

        const rd = t.closest('[data-round]');
        if (rd && !rd.hasAttribute('disabled')) {
          state.round = Math.min(3, Math.max(0, state.round + Number(rd.getAttribute('data-round'))));
          renderDetailPane();
          return;
        }

        if (t.closest('[data-unequip]') && state.detail) {
          const { side, index } = state.detail;
          state[side][index] = null;
          closeOverlay();
          renderWorkbench();
        }
      });

      let composing = false;
      $('canvas').addEventListener('compositionstart', () => { composing = true; });
      $('canvas').addEventListener('compositionend', (e) => {
        composing = false;
        if (e.target.classList.contains('search')) {
          state.search = e.target.value.trim();
          const pool = document.querySelector('.pool');
          if (pool) pool.innerHTML = poolCardsHtml();
        }
      });
      $('canvas').addEventListener('input', (e) => {
        if (!e.target.classList.contains('search') || composing) return;
        state.search = e.target.value.trim();
        const pool = document.querySelector('.pool');
        if (pool) pool.innerHTML = poolCardsHtml();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeOverlay();
      });

      window.addEventListener('resize', fit);

      $('canvas').addEventListener('dragstart', (e) => {
        const card = e.target.closest('[data-hero]');
        if (!card) return;
        e.dataTransfer.setData('text/plain', card.getAttribute('data-hero'));
        e.dataTransfer.effectAllowed = 'copy';
      });
      $('canvas').addEventListener('dragover', (e) => {
        const slot = e.target.closest('[data-slot]');
        if (!slot) return;
        e.preventDefault();
        slot.classList.add('drag-over');
      });
      $('canvas').addEventListener('dragleave', (e) => {
        const slot = e.target.closest('[data-slot]');
        if (!slot) return;
        if (e.relatedTarget && slot.contains(e.relatedTarget)) return;
        slot.classList.remove('drag-over');
      });
      $('canvas').addEventListener('drop', (e) => {
        const slot = e.target.closest('[data-slot]');
        if (!slot) return;
        e.preventDefault();
        slot.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        const [side, idx] = slot.getAttribute('data-slot').split('-');
        if (id) assign(side, Number(idx), id);
      });

      renderWorkbench();
      fit();
    })();
  </script>
</body>
</html>
