<style>
/* Huashu · assumptions: 演示战报冻结（红胜 / 6 回合 / 种子 384291）；加点与红度为纯 UI；竖屏不精修；不接引擎；不冒充网易客户端。form 来自六将面对面站位。 */

:root {
  --color-bg: #12100f;
  --color-surface: #1c1817;
  --color-surface-2: #241f1d;
  --color-line: #3a3330;
  --color-text: #eeeae4;
  --color-text-muted: #8a827c;
  --color-crimson: #8f2c2c;
  --color-gold: #c49a36;
  --color-green: #3a6b4a;
  --color-blue: #2a4a7c;
  --color-bar-remain: #8f2c2c;
  --color-bar-wound: #c49a36;
  --color-bar-dead: #4a4440;
  --color-portrait-fallback: #2a2523;
  --color-focus: #c49a36;
  --color-mask: color-mix(in srgb, var(--color-bg) 72%, transparent);
  --font-display: "Noto Serif SC", "Source Han Serif SC", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --radius: 8px;
  --card-accent: 2px solid var(--color-crimson);
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  line-height: 1.5;
  overflow-x: clip;
}
button, input {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  border: 0;
  background: none;
}
h1, h2, h3, .brand, .axis-title {
  font-family: var(--font-display);
  font-style: normal;
  overflow-wrap: anywhere;
  min-width: 0;
}
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

.studio {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 16px 28px;
  background:
    radial-gradient(1200px 480px at 50% -10%, color-mix(in srgb, var(--color-crimson) 16%, transparent), transparent 70%),
    var(--color-bg);
}
.studio-bar {
  width: min(100%, 1440px);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: nowrap;
}
.studio-bar button {
  white-space: nowrap;
  padding: 6px 12px;
  border: 1px solid var(--color-line);
  background: var(--color-surface);
  border-radius: var(--radius);
  color: var(--color-text-muted);
  font-size: 13px;
}
.studio-bar button.is-on {
  color: var(--color-text);
  border-color: var(--color-gold);
}
.stage-fit {
  display: grid;
  place-items: center;
  width: 100%;
}
.stage {
  position: relative;
  overflow: hidden;
  background:
    repeating-linear-gradient(
      135deg,
      transparent,
      transparent 7px,
      color-mix(in srgb, var(--color-line) 14%, transparent) 7px,
      color-mix(in srgb, var(--color-line) 14%, transparent) 8px
    ),
    var(--color-bg);
  box-shadow: 0 0 0 1px var(--color-line);
  transform-origin: top center;
}
.stage.vp-phone { width: 844px; height: 390px; }
.stage.vp-desktop { width: 1440px; height: 900px; }
.studio-note {
  margin: 14px 0 0;
  color: var(--color-text-muted);
  font-size: 12px;
}

.chrome {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 14px;
  height: 36px;
  border-bottom: 1px solid var(--color-line);
  background: var(--color-surface);
}
.brand {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.nav, .tabs {
  display: flex;
  gap: 14px;
  flex-wrap: nowrap;
}
.nav button, .tabs button {
  color: var(--color-text-muted);
  font-size: 13px;
  padding: 4px 0;
}
.nav button:hover, .tabs button:hover { color: var(--color-text); }
.tabs button.is-on {
  color: var(--color-gold);
  box-shadow: inset 0 -2px 0 var(--color-gold);
}

.body {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  min-height: 0;
}
.stage.vp-desktop.is-setup .body,
.stage.vp-desktop.is-stats .body {
  grid-template-columns: minmax(0, 1fr) 280px;
}
.stage.is-detail .body {
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
  grid-template-rows: auto minmax(0, 1fr);
}
.round-bar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px;
  border-bottom: 1px solid var(--color-line);
  background: var(--color-surface);
  flex-wrap: nowrap;
}
.round-bar span { font-size: 12px; color: var(--color-gold); }
.field {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 88px minmax(0, 1fr);
  min-height: 0;
  padding: 8px 10px 6px;
  gap: 8px;
}
.stage.vp-desktop .field {
  grid-template-columns: minmax(0, 1fr) 120px minmax(0, 1fr);
  padding: 18px 28px 12px;
  gap: 16px;
}
.stage.is-detail .field {
  padding: 6px 8px;
  min-height: 0;
  overflow: hidden;
}
.stage.is-detail .events {
  min-height: 0;
  overflow: hidden;
  margin: 6px 8px 6px 0;
}
.event-list { flex: 1; }
.stage.vp-phone.is-detail .hp-num { display: none; }
.axis .ghost { font-size: 12px; }

.team {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  min-width: 0;
  min-height: 0;
}
.team-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  min-width: 0;
}
.team-name {
  font-family: var(--font-display);
  font-style: normal;
  font-size: 13px;
  font-weight: 700;
}
.chip {
  padding: 1px 8px;
  border: 1px solid var(--color-line);
  background: var(--color-surface-2);
  border-radius: 999px;
  color: var(--color-gold);
  font-size: 11px;
}
.slots {
  display: grid;
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 6px;
  min-height: 0;
}
.stage.vp-desktop .slots { gap: 10px; }

.slot {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  min-width: 0;
  padding: 6px 8px;
  background: var(--color-surface);
  border: 1px solid var(--color-line);
  border-radius: var(--radius);

}
.team--red .slot {
  background: color-mix(in srgb, var(--color-crimson) 11%, var(--color-surface));

.team--blue .slot {

}
.slot.is-empty {
  display: flex;
  justify-content: center;
  color: var(--color-text-muted);
  border-bottom-style: dashed;
  background: var(--color-surface-2);
}
.slot.is-pick {
  box-shadow: 0 0 0 1px var(--color-gold);
}
.slot.is-fallen {
  filter: saturate(0.35) brightness(0.72);
}
.slot.is-on {
  box-shadow: 0 0 0 1px var(--color-gold);
}
.pos {
  display: block;

.who {

.who strong {

}
.dots { display: flex; gap: 5px; }
.dot {

  height: 7px;

}
.dot.g-A { background: var(--color-crimson); }
.dot.g-B { background: var(--color-green); }
.dot.g-C { background: var(--color-blue); }
.dot.g-D { background: var(--color-text-muted); }

.face {

  height: 56px;

  background: var(--color-portrait-fallback);

}
.stage.vp-desktop .face { width: 72px; height: 92px; }
.face img {
  width: 100%;
  height: 100%;

  object-position: top center;

}
.face.is-missing {
  display: grid;
  place-items: center;
  color: var(--color-text-muted);
  font-size: 11px;
  padding: 4px;
  text-align: center;
}
.face.is-missing::after,
.hero-art.is-missing::after {
  content: attr(data-name);
}

.hp {
  display: flex;
  height: 6px;
  margin-top: 4px;
  overflow: hidden;
  background: var(--color-bar-dead);
  border-radius: 2px;
}
.hp i { display: block; height: 100%; }
.hp-remain { background: var(--color-bar-remain); }
.hp-wound { background: var(--color-bar-wound); }
.hp-dead { background: var(--color-bar-dead); }
.hp-num {
  color: var(--color-text-muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.axis {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  border-left: 1px solid var(--color-line);
  border-right: 1px solid var(--color-line);
  min-width: 0;
}
.axis-title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-gold);
}
.axis p {
  margin: 0;
  color: var(--color-text-muted);
  font-size: 11px;
}
.badge {
  padding: 1px 6px;
  border: 1px solid var(--color-gold);
  color: var(--color-gold);
  border-radius: 999px;
  font-size: 10px;
}
.legend {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 10px;
  color: var(--color-text-muted);
}
.legend b { font-weight: 500; }
.swatch {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 4px;
  vertical-align: -1px;
}
.swatch.r { background: var(--color-bar-remain); }
.swatch.w { background: var(--color-bar-wound); }
.swatch.d { background: var(--color-bar-dead); }

.stats-card .meta {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 2px;
  margin-top: 2px;
  font-size: 11px;
  color: var(--color-text-muted);
}
.stats-card .meta strong {
  display: block;
  color: var(--color-text);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.heal strong { color: var(--color-green); }

.events {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--color-line);
  background: var(--color-surface);
  border-radius: var(--radius);
  border-bottom: var(--card-accent);
}
.round-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-bottom: 1px solid var(--color-line);
  flex-wrap: nowrap;
}
.round-nav span { font-size: 12px; color: var(--color-gold); }
.event-list {
  overflow: auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
}
.event {
  margin: 0;
  font-size: 12px;
  color: var(--color-text);
}
.event button.net {
  color: var(--color-gold);
  text-decoration: underline;
  text-underline-offset: 2px;
}

.dock {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  height: 48px;
  padding: 0 12px;
  border-top: 1px solid var(--color-line);
  background: var(--color-surface);
}
.morale {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--color-text-muted);
}
.morale b {
  color: var(--color-text);
  font-variant-numeric: tabular-nums;
  min-width: 2ch;
  text-align: center;
}
.morale button, .icon-btn, .ghost, .primary {
  border-radius: var(--radius);
  padding: 6px 10px;
}
.morale button, .icon-btn, .ghost {
  border: 1px solid var(--color-line);
  background: var(--color-surface-2);
}
.primary {
  background: var(--color-crimson);
  color: var(--color-text);
  padding: 8px 22px;
  font-weight: 600;
}
.dock-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.morale--blue { justify-content: flex-end; }

.rail {
  min-width: 0;
  min-height: 0;
  border-left: 1px solid var(--color-line);
  background: var(--color-surface);
  display: none;
  flex-direction: column;
}
.stage.vp-desktop.is-setup .rail,
.stage.vp-desktop.is-stats .rail { display: flex; }
.rail h2, .sheet h2, .float h2, .panel h2 {
  margin: 0;
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 700;
  border-bottom: 1px solid var(--color-line);
}
.pool {
  overflow: auto;
  padding: 8px;
  display: grid;
  gap: 6px;
  min-height: 0;
}
.pool-card {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  padding: 6px;
  background: var(--color-surface-2);
  border: 1px solid var(--color-line);
  border-radius: var(--radius);
  border-bottom: var(--card-accent);
  text-align: left;
}
.pool-card .face { width: 36px; height: 46px; }
.pool-card.is-used {
  opacity: 0.38;
  cursor: not-allowed;
}
.skill-rows { padding: 8px; display: grid; gap: 6px; overflow: auto; }
.skill-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px;
  padding: 8px;
  background: var(--color-surface-2);
  border-radius: var(--radius);
  border-bottom: var(--card-accent);
  font-size: 12px;
}
.skill-row small { color: var(--color-text-muted); }

.sheet, .layer {
  position: absolute;
  inset: 0;
  z-index: 6;
}
.layer { z-index: 8; }
.sheet { pointer-events: none; }
.sheet-mask {
  position: absolute;
  inset: 0;
  background: var(--color-mask);
}
.layer {
  background: var(--color-mask);
}
.sheet-panel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(260px, 72%);
  background: var(--color-surface);
  border-left: 1px solid var(--color-line);
  display: flex;
  flex-direction: column;
  transform: translateX(110%);
  transition: transform 200ms ease;
  pointer-events: auto;
}
.sheet.is-open { pointer-events: auto; }
.sheet.is-open .sheet-panel { transform: translateX(0); }
.layer {
  display: grid;
  place-items: center;
  padding: 10px;
}
.panel {
  position: relative;
  z-index: 1;
  width: min(100%, 720px);
  max-height: 100%;
  overflow: auto;
  background: var(--color-surface);
  border: 1px solid var(--color-line);
  border-radius: var(--radius);
  border-bottom: var(--card-accent);
}
.hero-panel {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: minmax(0, 0.38fr) minmax(0, 1fr);
  width: min(100%, 780px);
  max-height: 100%;
  overflow: hidden;
  background: var(--color-surface);
  border-radius: var(--radius);
  border-bottom: var(--card-accent);
}
.hero-art {
  background: var(--color-portrait-fallback);
  min-height: 0;
}
.hero-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}
.hero-art.is-missing {
  display: grid;
  place-items: center;
  color: var(--color-text-muted);
}
.hero-form {
  overflow: auto;
  padding: 12px 14px 14px;
  min-width: 0;
}
.hero-form h2 { border: 0; padding: 0 28px 8px 0; font-size: 20px; }
.close {
  position: absolute;
  top: 10px;
  right: 12px;
  width: 32px;
  height: 32px;
  border: 1px solid var(--color-line);
  background: var(--color-surface-2);
  border-radius: var(--radius);
  z-index: 2;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 8px 0;
  font-size: 13px;
}
.step { display: flex; align-items: center; gap: 6px; }
.skills-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  margin-top: 10px;
}
.sk {
  padding: 8px 6px;
  background: var(--color-surface-2);
  border-radius: var(--radius);
  border-bottom: var(--card-accent);
  font-size: 12px;
  text-align: center;
}
.sk small { display: block; color: var(--color-text-muted); }

.float {
  width: min(100%, 560px);
}
.share-grid {
  display: grid;

  padding: 12px;
}
.share-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr);
  gap: 8px;
  align-items: center;
}
.bars span {
  display: block;
  height: 8px;
}
.hist-item, .skill-item {
  padding: 10px 12px;
  border-top: 1px solid var(--color-line);

.empty {
  padding: 18px 12px;

.toast {

.mod {

.mod h3 { margin: 0 0 6px; font-size: 13px; }

<script>
/**
 * 套1 · 对阵沙盘演示。战斗结果冻结，不用 Math.random。
 * 画像相对本文件：../public/portraits/{file}.jpg
 */
const POS = ["大营", "中军", "前锋"];
const PORTRAIT = (file) => `../public/portraits/${file}.jpg`;

/** @typedef {{id:string,name:string,file:string,main:string,extras:string[],grades:string[]}} Hero */

/** 演示武将：主战法名来自仓库 skills.ts，查不到的写「主战法」。 */
const HEROES = {

/**
 * 缺图时去掉 img，留下灰底姓名。
 * @param {HTMLImageElement} img
 */
function onArtErr(img) {
  const box = img.parentElement;
  img.remove();
  if (box) box.classList.add("is-missing");
}

/** @param {string|null} id */
function hero(id) { return id ? HEROES[id] : null; }

/** 双方已上阵 id，用于池内禁用。 */
function usedIds() {
  return new Set([...state.teams.red, ...state.teams.blue].filter(Boolean));
}

function face(h, cls) {
  if (!h) return "";
  return `<div class="face ${cls || ""}" data-name="${h.name}">
    <img src="${PORTRAIT(h.file)}" alt="" onerror="onArtErr(this)" />
  </div>`;
}

function hpBar(parts) {
  const [a, b, c] = parts;
  const t = a + b + c || 1;
  return `<div class="hp" aria-hidden="true">
    <i class="hp-remain" style="width:${(a / t) * 100}%"></i>
    <i class="hp-wound" style="width:${(b / t) * 100}%"></i>
    <i class="hp-dead" style="width:${(c / t) * 100}%"></i>
  </div>`;
}

function troopsOf(id) {
  const src = state.mode === "report" && state.tab === "detail"
    ? ROUNDS[state.roundIdx].troops
    : FINAL_TROOPS;
  return src[id] || [9000, 0, 0];
}

/**
 * 渲染一侧三槽。
 * @param {"red"|"blue"} side
 */
function renderTeam(side) {
  const ids = state.teams[side];
  const label = side === "red" ? "红队" : "蓝队";
  const chip = side === "red" ? "三蜀" : "三魏·骑兵";
  const slots = ids.map((id, i) => {
    const h = hero(id);
    const picking = state.pick && state.pick.side === side && state.pick.i === i;
    if (!h) {
      return `<button type="button" class="slot is-empty${picking ? " is-pick" : ""}" data-act="empty" data-side="${side}" data-i="${i}">
        点此上阵<span class="pos"> · ${POS[i]}</span>
      </button>`;
    }
    if (state.mode === "setup") {
      return `<button type="button" class="slot${picking ? " is-pick" : ""}" data-act="open-hero" data-side="${side}" data-i="${i}">
        ${face(h)}
        <span class="who"><strong>${h.name}</strong><span class="pos">${POS[i]}</span>
          <span class="dots">${h.extras.map((n, k) => `<i class="dot g-${h.grades[k + 1]}" title="${n}"></i>`).join("")}</span>
        </span>
      </button>`;
    }
    const parts = troopsOf(id);
    const fallen = parts[0] === 0 ? " is-fallen" : "";
    const on = state.statsId === id ? " is-on" : "";
    if (state.tab === "stats") {
      const s = STATS[id] || { dmg: 0, heal: 0, atk: 0 };
      return `<button type="button" class="slot stats-card${fallen}${on}" data-act="stats-hero" data-id="${id}">
        ${face(h)}
        <span class="who"><strong>${h.name}</strong><span class="pos">${POS[i]}</span>
          <span class="meta">
            <span>杀伤<strong>${s.dmg}</strong></span>
            <span class="heal">恢复<strong>${s.heal}</strong></span>
            <span>普攻<strong>${s.atk}</strong></span>
          </span>
        </span>
      </button>`;
    }
    return `<div class="slot${fallen}">
      ${face(h)}
      <span class="who"><strong>${h.name}</strong><span class="pos">${POS[i]}</span>
        ${hpBar(parts)}
        <span class="hp-num">${parts[0]} / 伤 ${parts[1]} / 阵 ${parts[2]}</span>
      </span>
    </div>`;
  }).join("");
  return `<section class="team team--${side}">
    <div class="team-head">
      <span class="team-name">${label}</span>
      <button type="button" class="chip" data-act="bonus" data-side="${side}">${chip}</button>
    </div>
    <div class="slots">${slots}</div>
  </section>`;
}

function renderEvents() {

      return `<p class="event">【${e.tgt}】来自【${e.src}】的【${e.skill}】当前生效几率为 ${e.rate}%</p>`;
    }
    if (e.kind === "note") return `<p class="event">${e.text}</p>`;
    const word = e.net >= 0 ? "提升" : "降低";
    return `<p class="event">${e.src} 的【${e.skill}】对 ${e.tgt} 造成 ${e.amount}
      <button type="button" class="net" data-act="mod" data-i="${i}">此次伤害共计${word} ${Math.abs(e.net)}%</button>
    </p>`;
  }).join("");
  return `<aside class="events"><div class="event-list">${lines}</div></aside>`;
}

      ${face(h)}
      <span class="who"><strong>${h.name}</strong><span class="pos">${h.main}</span></span>
    </button>`;
  }).join("");
}

    const e = state.edit;
    bits.push(`<div class="layer">
      <button type="button" class="close" data-act="close-hero" aria-label="关闭">×</button>
      <div class="hero-panel" data-stop="1">
        <div class="hero-art" data-name="${h.name}">
          <img src="${PORTRAIT(h.file)}" alt="" onerror="onArtErr(this)" />
        </div>
        <div class="hero-form">
          <h2>${h.name}</h2>
          <div class="row"><span>等级</span><span class="step">
            <button type="button" class="ghost" data-act="edit" data-k="level" data-d="-1">−</button>${e.level}
            <button type="button" class="ghost" data-act="edit" data-k="level" data-d="1">+</button></span></div>
          <div class="row"><span>红度</span><span class="step">
            <button type="button" class="ghost" data-act="edit" data-k="red" data-d="-1">−</button>${e.red}
            <button type="button" class="ghost" data-act="edit" data-k="red" data-d="1">+</button></span></div>
          <div class="row"><span>加点 攻</span><span class="step">
            <button type="button" class="ghost" data-act="edit" data-k="atk" data-d="-1">−</button>${e.atk}
            <button type="button" class="ghost" data-act="edit" data-k="atk" data-d="1">+</button></span></div>
          <div class="row"><span>加点 防</span><span class="step">
            <button type="button" class="ghost" data-act="edit" data-k="def" data-d="-1">−</button>${e.def}
            <button type="button" class="ghost" data-act="edit" data-k="def" data-d="1">+</button></span></div>
          <div class="row"><span>加点 谋</span><span class="step">
            <button type="button" class="ghost" data-act="edit" data-k="st" data-d="-1">−</button>${e.st}
            <button type="button" class="ghost" data-act="edit" data-k="st" data-d="1">+</button></span></div>
          <div class="row"><span>加点 速</span><span class="step">
            <button type="button" class="ghost" data-act="edit" data-k="spd" data-d="-1">−</button>${e.spd}
            <button type="button" class="ghost" data-act="edit" data-k="spd" data-d="1">+</button></span></div>
          <div class="skills-3">
            <div class="sk">${h.main}<small>主战法 · ${h.grades[0]}</small></div>
            <div class="sk">${h.extras[0]}<small>携带 · ${h.grades[1]}</small></div>
            <div class="sk">${h.extras[1]}<small>携带 · ${h.grades[2]}</small></div>
          </div>
          <div class="row"><button type="button" class="ghost" data-act="unequip">卸下</button></div>
        </div>
      </div>
    </div>`);
  }

  if (state.bonus) {
    const title = state.bonus === "red" ? "三蜀 · 战斗中生效" : "三魏·骑兵 · 战斗中生效";
    const body = state.bonus === "red"
      ? "<p class=\"hist-item\">阵营加成 · 蜀</p><p class=\"hist-item\">兵种加成 · 步兵系</p>"
      : "<p class=\"hist-item\">阵营加成 · 魏</p><p class=\"hist-item\">兵种加成 · 骑兵系</p>";
    bits.push(`<div class="layer"><div class="panel float" data-stop="1"><h2>${title}</h2>${body}</div></div>`);
  }
  if (state.nav === "history") {
    bits.push(`<div class="layer"><div class="panel float" data-stop="1">
      <h2>战报</h2>
      <button type="button" class="hist-item" data-act="open-demo">红胜 · 6 回合 · 种子 384291 · 演示战报</button>
    </div></div>`);
  }
  if (state.nav === "skills") {
    bits.push(`<div class="layer"><div class="panel float" data-stop="1">
      <h2>战法</h2>
      <p class="skill-item">皇裔流离 · 指挥</p>
      <p class="skill-item">诸葛锦囊 · 主动</p>
      <p class="skill-item">银龙冲阵 · 主动</p>
      <p class="skill-item">魏武之世 · 指挥</p>
      <p class="skill-item">奇佐鬼谋 · 主动</p>
      <p class="skill-item">其疾如风 · 指挥</p>
    </div></div>`);
  }
  if (state.share) {
    bits.push(`<div class="layer"><div class="panel float" data-stop="1">
      <h2>占比 · 演示战报</h2>
      <div class="share-grid">
        ${shareRow("h16", "h23")}
        ${shareRow("h17", "h476")}
        ${shareRow("zhaoyun", "h27")}
      </div>
    </div></div>`);
  }
  if (state.mod) {
    const e = ROUNDS[state.roundIdx].events[state.mod];
    const up = (e.up || []).map((x) => `<p>【${x.who}】【${x.skill}】${x.text}</p>`).join("");
    const down = (e.down || []).map((x) => `<p>【${x.who}】【${x.skill}】${x.text}</p>`).join("");
    bits.push(`<div class="layer"><div class="mod" data-stop="1">
      <h3>增减伤统计</h3>
      <p>伤害提升合计</p>${up || "<p>—</p>"}
      <p>伤害降低合计</p>${down || "<p>—</p>"}
    </div></div>`);
  }
  if (state.toast) bits.push(`<div class="toast" role="status">${state.toast}</div>`);
  return bits.join("");
}

function stageClass() {
  const parts = ["stage", state.vp === "desktop" ? "vp-desktop" : "vp-phone"];
  if (state.mode === "setup") parts.push("is-setup");
  if (state.mode === "report" && state.tab === "stats") parts.push("is-stats");
  if (state.mode === "report" && state.tab === "detail") parts.push("is-detail");
  return parts.join(" ");
}

/** 重绘画布。视口切换只改外壳 class 与尺寸。 */
function render() {
  const el = document.getElementById("stage");
  el.className = stageClass();
  el.innerHTML = `${renderTop()}
    <div class="body">
      ${renderRoundBar()}
      <div class="field">${renderField()}</div>
      ${state.mode === "report" && state.tab === "detail" ? renderEvents() : ""}
      ${renderRail()}
    </div>
    ${renderDock()}
    ${overlays()}`;
  fitStage();
}

/** 画布按窗口缩小，不改 844×390 / 1440×900 设计尺寸。 */
function fitStage() {
  const stage = document.getElementById("stage");
  const w = state.vp === "desktop" ? 1440 : 844;
  const h = state.vp === "desktop" ? 900 : 390;
  const maxW = Math.max(320, window.innerWidth - 32);
  const maxH = Math.max(200, window.innerHeight - 96);
  const s = Math.min(1, maxW / w, maxH / h);
  stage.style.transform = `scale(${s})`;
}

function toast(msg) {
  state.toast = msg;
  render();
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(() => { state.toast = ""; render(); }, 2200);
}

function stopAuto() {
  state.autoplay = false;
  window.clearInterval(autoTimer);
}

/**
 * 点击委托。
 * @param {MouseEvent} ev
 */
function onClick(ev) {
  const t = ev.target;
  if (!(t instanceof Element)) return;
  const btn = t.closest("[data-vp]");
  if (btn) {
    state.vp = btn.getAttribute("data-vp");
    document.querySelectorAll("[data-vp]").forEach((b) => b.classList.toggle("is-on", b === btn));
    if (state.vp === "desktop") state.pick = state.pick;
    render();
    return;
  }
  const hit = t.closest("[data-act]");
  const layer = t.closest(".layer");
  if (layer && !t.closest("[data-stop]") && !hit) {
    state.hero = null;
    state.bonus = null;
    state.nav = null;
    state.share = false;
    state.mod = null;
    render();
    return;
  }
  if (!hit) return;
  if (t.closest("[data-stop]") && !hit.closest("[data-stop]")) return;
  const act = hit.getAttribute("data-act");

  if (act === "empty") {
    state.pick = { side: hit.dataset.side, i: Number(hit.dataset.i) };
    render();
    return;
  }
  if (act === "close-pick") { state.pick = null; render(); return; }
  if (act === "pick") {
    if (!state.pick) {
      toast("先点空位再上阵");
      return;
    }
    const id = hit.dataset.id;
    if (usedIds().has(id)) { toast("双方不能使用同一武将"); return; }
    state.teams[state.pick.side][state.pick.i] = id;
    state.pick = null;
    render();
    return;
  }
  if (act === "open-hero") {
    state.pick = null;
    state.hero = { side: hit.dataset.side, i: Number(hit.dataset.i) };
    state.edit = { level: 40, red: 0, atk: 40, def: 0, st: 0, spd: 0 };
    render();
    return;
  }
  if (act === "close-hero") { state.hero = null; render(); return; }
  if (act === "unequip") {
    state.teams[state.hero.side][state.hero.i] = null;
    state.hero = null;
    render();
    return;
  }
  if (act === "edit") {
    const k = hit.dataset.k;
    const d = Number(hit.dataset.d);
    const lim = { level: [40, 50], red: [0, 5], atk: [0, 40], def: [0, 40], st: [0, 40], spd: [0, 40] };
    const [lo, hi] = lim[k];
    state.edit[k] = Math.min(hi, Math.max(lo, state.edit[k] + d));
    render();
    return;
  }
  if (act === "bonus") { state.bonus = hit.dataset.side; render(); return; }
  if (act === "nav") { state.nav = hit.dataset.nav; render(); return; }
  if (act === "close-float") { state.bonus = null; state.nav = null; state.share = false; render(); return; }
  if (act === "morale") {
    const side = hit.dataset.side;
    state.morale[side] = Math.min(140, Math.max(80, state.morale[side] + Number(hit.dataset.d)));
    render();
    return;
  }
  if (act === "start") {
    const ok = state.teams.red.some(Boolean) && state.teams.blue.some(Boolean);
    if (!ok) { toast("红蓝两队都至少需要 1 名武将"); return; }
    state.snap = { red: [...state.teams.red], blue: [...state.teams.blue] };
    state.mode = "report";
    state.tab = "brief";
    state.roundIdx = 2;
    state.pick = null;
    state.hero = null;
    render();
    return;
  }
  if (act === "tab") {
    state.tab = hit.dataset.tab;
    if (state.tab !== "detail") stopAuto();
    if (state.tab !== "stats") state.statsId = null;
    render();
    return;
  }
  if (act === "back" || act === "again") {
    stopAuto();
    state.mode = "setup";
    state.tab = "brief";
    state.statsId = null;
    state.share = false;
    render();
    return;
  }
  if (act === "reuse") {
    stopAuto();
    if (state.snap) {
      state.teams.red = [...state.snap.red];
      state.teams.blue = [...state.snap.blue];
    }
    state.mode = "setup";
    render();
    return;
  }
  if (act === "stats-hero") {
    state.statsId = hit.dataset.id;
    render();
    return;
  }
  if (act === "close-stats") { state.statsId = null; render(); return; }
  if (act === "share") { state.share = true; render(); return; }
  if (act === "open-demo") {
    state.nav = null;
    if (state.teams.red.some(Boolean) && state.teams.blue.some(Boolean)) {
      state.mode = "report";
      state.tab = "brief";
    }
    render();
    return;
  }
  if (act === "prev-round") {
    state.roundIdx = (state.roundIdx + ROUNDS.length - 1) % ROUNDS.length;
    render();
    return;
  }
  if (act === "next-round") {
    state.roundIdx = (state.roundIdx + 1) % ROUNDS.length;
    render();
    return;
  }
  if (act === "auto") {
    state.autoplay = !state.autoplay;
    window.clearInterval(autoTimer);
    if (state.autoplay) {
      autoTimer = window.setInterval(() => {
        state.roundIdx = (state.roundIdx + 1) % ROUNDS.length;
        render();
      }, 1600);
    }
    render();
    return;
  }
  if (act === "mod") { state.mod = Number(hit.dataset.i); render(); return; }
  if (act === "close-mod") { state.mod = null; render(); return; }
}

document.addEventListener("click", onClick);
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape") return;
  state.pick = null;
  state.hero = null;
  state.bonus = null;
  state.nav = null;
  state.share = false;
  state.mod = null;
  state.statsId = state.vp === "phone" ? null : state.statsId;
  render();
});
window.addEventListener("resize", fitStage);
render();
</script>
</body>
</html>
